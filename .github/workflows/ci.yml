name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Validate Compose configuration
        env:
          CORS_ORIGIN: https://gather.example.com
          JWT_SECRET: configuration-validation-only-not-a-runtime-secret
        run: docker compose config --quiet

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Type check and build
        env:
          VITE_API_URL: /api
        run: npm run build
      - name: Save frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
      - name: Save frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Save backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  runtime-test:
    needs: [workflow-lint, frontend-test, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORS_ORIGIN: https://gather.example.com
      GATHER_PORT: '18080'
      COMPOSE_PROJECT_NAME: gather-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Select image names and temporary signing key
        run: |
          echo "GATHER_IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "GATHER_IMAGE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.api
          load: true
          tags: ${{ env.GATHER_IMAGE_PREFIX }}-api:${{ env.GATHER_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.web
          load: true
          tags: ${{ env.GATHER_IMAGE_PREFIX }}-web:${{ env.GATHER_IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Start production containers
        run: docker compose up --detach --no-build --wait --wait-timeout 90
      - name: Exercise the production HTTP stack
        env:
          SMOKE_BASE_URL: http://127.0.0.1:18080
        run: node scripts/smoke-deployment.mjs
      - name: Export the tested images
        run: |
          docker save "$GATHER_IMAGE_PREFIX-api:$GATHER_IMAGE_TAG" \
            "$GATHER_IMAGE_PREFIX-web:$GATHER_IMAGE_TAG" | gzip > runtime-images.tar.gz
          sha256sum runtime-images.tar.gz > runtime-images.tar.gz.sha256
      - name: Save tested images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-images
          path: |
            runtime-images.tar.gz
            runtime-images.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove temporary containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-images:
    needs: runtime-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-images
      - name: Verify and load tested images
        run: |
          sha256sum --check runtime-images.tar.gz.sha256
          docker load --input runtime-images.tar.gz
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit tags and update main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in api web; do
            docker push "$prefix-$service:sha-$GITHUB_SHA"
          done
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            for service in api web; do
              docker tag "$prefix-$service:sha-$GITHUB_SHA" "$prefix-$service:main"
              docker push "$prefix-$service:main"
            done
          fi
          {
            echo '### Published tested images'
            echo "- $prefix-api:sha-$GITHUB_SHA"
            echo "- $prefix-web:sha-$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
